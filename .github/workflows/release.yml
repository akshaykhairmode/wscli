name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test

  release:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Auto-increment and push tag
        id: tag
        run: |
          set -euo pipefail

          git config user.name "Akshay Khairmode"
          git config user.email "akshaykhairmode@gmail.com"

          # On a normal main push, skip if HEAD is already tagged.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::notice::HEAD is already tagged; skipping release."
              echo "new_tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          bump="${{ inputs.bump || 'patch' }}"

          git fetch origin --tags --force
          all_tags=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | uniq)

          if [ -z "$all_tags" ]; then
            new_tag="v0.1.0"
          else
            latest=$(echo "$all_tags" | tail -1)
            IFS='.' read -r major minor patch <<< "${latest#v}"
            case "$bump" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
            esac
            new_tag="v${major}.${minor}.${patch}"
          fi

          echo "Creating tag $new_tag (bump: $bump, previous latest: ${latest:-none})"

          # Allow re-runs: recreate the tag at the current commit if it already exists.
          if git tag --list | grep -q "^$new_tag$"; then
            git tag -d "$new_tag"
            git push origin ":refs/tags/$new_tag" || true
          fi

          git tag -a "$new_tag" -m "Release $new_tag"
          git push origin "$new_tag"

          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: steps.tag.outputs.new_tag != ''
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREW_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}

  docker:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_tag != ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: akshaykhairmode
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_TAG=${{ needs.release.outputs.new_tag }}
          tags: |
            akshaykhairmode/wscli:${{ needs.release.outputs.new_tag }}
            akshaykhairmode/wscli:latest
